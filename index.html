<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wipeout-on-pc</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #222; --muted: #666; --line: #ddd; --chip: #eee; --on: #222; --onfg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #ddd; --muted: #999; --line: #333; --chip: #222; --on: #ddd; --onfg: #111; } }
  body { margin: 0; padding: 1rem; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1rem; color: var(--muted); }
  p.sub a { color: inherit; }
  .legend { border: 1px solid var(--line); border-radius: .4rem; padding: .4rem .8rem; margin-bottom: 1rem; }
  .legend summary { cursor: pointer; font-weight: 600; }
  .legend .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: .5rem 1.5rem; margin-top: .5rem; }
  .legend h3 { font-size: .85rem; margin: .3rem 0 .2rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .legend ul { list-style: none; margin: 0; padding: 0; }
  .legend li { margin: .1rem 0; }
  .legend li span:first-child { display: inline-block; width: 1.6rem; }
  [title] { cursor: help; }
  .filters { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin-bottom: 1rem; }
  .group { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; }
  .group b { margin-right: .25rem; color: var(--muted); font-weight: 600; }
  .chip { border: 1px solid var(--line); background: var(--chip); border-radius: 1rem; padding: .1rem .6rem; cursor: pointer; user-select: none; }
  .chip.on { background: var(--on); color: var(--onfg); border-color: var(--on); }
  input[type=search] { padding: .3rem .6rem; border: 1px solid var(--line); border-radius: .4rem; background: var(--bg); color: var(--fg); min-width: 16rem; }
  .count { color: var(--muted); margin-left: auto; align-self: center; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; vertical-align: top; padding: .35rem .5rem; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--bg); cursor: pointer; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  td a { color: inherit; }
  code { font-size: .9em; background: var(--chip); padding: 0 .25em; border-radius: .2em; }
</style>
</head>
<body>
<h1>wipeout-on-pc</h1>
<p class="sub">Filterable view of <a href="README.md">README.md</a> and the category files. Click chips to filter, click a header to sort, hover any emoji for its meaning.</p>
<details class="legend" id="legend" open><summary>Legend</summary><div class="cols"></div></details>
<div class="filters" id="filters"></div>
<div class="wrap"><table id="t"><thead></thead><tbody></tbody></table></div>

<script>
const FILES = ['reimplementations.md', 'emulator-helpers.md', 'tools.md'];
const DETAIL_COLS = ['Approach', 'Type', 'What', 'Engine', 'Covers'];
const COLS = ['Play', 'Category', 'Game', 'Project', 'Details', 'Parity', 'Health', 'Legal', 'Notes'];
const EMOJI = /^(\p{Extended_Pictographic}|\p{Emoji_Presentation})(️)?/u;

// Legend: facet -> [emoji, meaning]. Health grade and Legal share colours, so each is scoped to its column.
const LEGEND = {
  'Legal exposure': [
    ['🟢', 'Low: nothing of Sony\'s distributed or executed'],
    ['🟡', 'Moderate: executes Sony code from your own dump, distributes nothing'],
    ['🟠', 'Grey: redistributes transformed Sony material (leaked-source derivative, upscaled textures)'],
    ['🔴', 'High: redistributes Sony material as is (ISO, DLC, assets)'],
  ],
  'Health grade': [
    ['🟢', '4 to 6 badges'],
    ['🟡', '2 or 3 badges'],
    ['🔴', '0 or 1 badge'],
  ],
  'Health badges': [
    ['🕒', 'Pushed within the last 12 months'],
    ['👥', 'At least 3 contributors'],
    ['🚀', 'Tagged releases'],
    ['🤖', 'CI (GitHub Actions)'],
    ['🧪', 'Test suite present'],
    ['📜', 'Explicit SPDX licence'],
  ],
  'Approach': [
    ['🖊️', 'Rewrite: hand-written reimplementation'],
    ['🔬', 'Decompilation: matching C source'],
    ['🔁', 'Static recompilation of the original executable'],
    ['🧬', 'Native runtime: PS4 binary runs on the host CPU'],
    ['🍴', 'Fork of another listed project'],
    ['👁️', 'Viewer'],
  ],
  'Parity': [
    ['🎯', 'Byte-exact rebuild of the original executable'],
    ['✅', 'Behaviour-exact: original code executes'],
    ['✨', 'Enhanced: behaviour deliberately changed'],
  ],
  'Play': [
    ['🎮', 'Playable: launches a game you can play (port, rewrite, recomp, successor)'],
    ['🔧', 'Other: patch, texture pack, tool, documentation'],
  ],
  'Helper type': [
    ['🩹', 'Cheat code, memory patch or pnach'],
    ['🖼️', 'Texture pack'],
    ['💿', 'ISO patch (xdelta)'],
    ['📖', 'How-to'],
    ['🧰', 'Misc tool'],
  ],
};
const COLOUR_SCOPE = { Legal: 'Legal exposure', Health: 'Health grade' };
const MEANING = {};
for (const [facet, items] of Object.entries(LEGEND)) for (const [e, m] of items) {
  const key = e.replace('️', '');
  (MEANING[key] ||= {})[facet] = m;
}
const meaning = (e, scope) => {
  const m = MEANING[e.replace('️', '')];
  if (!m) return '';
  if (m[scope]) return m[scope];
  const entries = Object.entries(m);
  return entries.length === 1 ? entries[0][1] : entries.map(([f, t]) => `${f}: ${t}`).join('\n');
};
const ANY_EMOJI = /(\p{Extended_Pictographic}|\p{Emoji_Presentation})️?/gu;
const tip = (s, scope) => s.replace(ANY_EMOJI, e => { const t = meaning(e, scope); return t ? `<span title="${t.replace(/"/g, '&quot;')}">${e}</span>` : e; });

const md = (s, scope) => tip(s
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/\*([^*]+)\*/g, '<em>$1</em>'), scope);

function buildLegend() {
  const box = document.querySelector('#legend .cols');
  box.innerHTML = Object.entries(LEGEND).map(([facet, items]) =>
    `<div><h3>${facet}</h3><ul>${items.map(([e, m]) => `<li><span>${e}</span>${m}</li>`).join('')}</ul></div>`).join('');
}

function parse(file, text) {
  const rows = [];
  let section = '', header = null;
  for (const line of text.split('\n')) {
    if (line.startsWith('## ')) { section = line.slice(3).trim(); header = null; continue; }
    if (!line.startsWith('|')) { header = null; continue; }
    const cells = line.split('|').slice(1, -1).map(c => c.trim());
    if (!header) { header = cells; continue; }
    if (cells.every(c => /^-+$/.test(c))) continue;
    if (!header.includes('Legal')) continue;
    const get = name => { const i = header.indexOf(name); return i >= 0 ? cells[i] || '' : ''; };
    const details = DETAIL_COLS.filter(c => header.includes(c)).map(get).filter(Boolean).join(' · ');
    const gs = games(get('Game') || section);
    const playable = file.startsWith('reimplementations') && (/^(🖊|🍴|🔁|🧬)/u.test(details) || /successors/i.test(section));
    rows.push({
      Play: playable ? '🎮' : '🔧',
      Category: file.replace('.md', ''),
      Game: gs.join(', '), Games: gs,
      Project: get('Project'), Details: details, Parity: get('Parity'),
      Health: get('Health'), Legal: get('Legal'), Notes: get('Notes'),
    });
  }
  return rows;
}

// Canonical game names. A row may match several (e.g. "Pure, Pulse", "all PSP").
const GAMES = [
  ['2097 / XL', /2097|\bXL\b/i],
  ['Wip3out', /wip3out|wipeout 3\b/i],
  ['Fusion', /fusion/i],
  ['Pure', /\bpure\b|all PSP/i],
  ['Pulse', /\bpulse\b|all PSP/i],
  ['HD / Fury', /\bHD\b|fury/i],
  ['2048', /2048/],
  ['Omega Collection', /omega/i],
  ['Cross-series', /cross-series|PSX to PS5|\ball\b(?! PSP)/i],
  ['Successors', /successors/i],
  ['Infrastructure', /infrastructure/i],
];
const GAME_ORDER = ['WipEout (1995)', ...GAMES.map(([n]) => n)];  // chronological, then cross-cutting
function games(text) {
  const out = GAMES.filter(([, re]) => re.test(text)).map(([n]) => n);
  return out.length ? out : (/wipeout|WO1/i.test(text) ? ['WipEout (1995)'] : [text]);
}

const firstEmoji = s => (s.match(EMOJI) || [''])[0].replace('️', '');
const FACETS = {
  Play: r => r.Play,
  Category: r => r.Category,
  Game: r => r.Games,
  Approach: r => firstEmoji(r.Details),
  Parity: r => firstEmoji(r.Parity),
  Health: r => firstEmoji(r.Health),
  Legal: r => firstEmoji(r.Legal),
};
const active = {}; let rows = [], sortKey = null, sortDir = 1, q = '';

function buildFilters() {
  const box = document.getElementById('filters');
  for (const [name, fn] of Object.entries(FACETS)) {
    const vals = [...new Set(rows.flatMap(fn).filter(Boolean))].sort();
    if (name === 'Game') vals.sort((a, b) => (GAME_ORDER.indexOf(a) + 1 || 99) - (GAME_ORDER.indexOf(b) + 1 || 99));
    if (vals.length < 2) continue;
    active[name] = new Set();
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<b>${name}</b>`;
    for (const v of vals) {
      const c = document.createElement('span'); c.className = 'chip'; c.textContent = v;
      const t = meaning(v, COLOUR_SCOPE[name] || name); if (t) c.title = t;
      c.onclick = () => { active[name].has(v) ? active[name].delete(v) : active[name].add(v); c.classList.toggle('on'); render(); };
      g.appendChild(c);
    }
    box.appendChild(g);
  }
  const s = document.createElement('input'); s.type = 'search'; s.placeholder = 'search…';
  s.oninput = () => { q = s.value.toLowerCase(); render(); };
  box.appendChild(s);
  const n = document.createElement('span'); n.className = 'count'; n.id = 'count'; box.appendChild(n);
}

function render() {
  let out = rows.filter(r => Object.entries(active).every(([k, set]) => !set.size || [FACETS[k](r)].flat().some(v => set.has(v))));
  if (q) out = out.filter(r => COLS.map(c => r[c]).join(' ').toLowerCase().includes(q));
  if (sortKey) out = [...out].sort((a, b) => sortDir * a[sortKey].localeCompare(b[sortKey]));
  document.querySelector('#t thead').innerHTML = '<tr>' + COLS.map(c => `<th data-k="${c}">${c}${sortKey === c ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr>';
  document.querySelectorAll('#t th').forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); });
  document.querySelector('#t tbody').innerHTML = out.map(r => '<tr>' + COLS.map(c =>
    `<td class="${['Play', 'Health', 'Legal', 'Parity', 'Category'].includes(c) ? 'nowrap' : ''}">${md(r[c], COLOUR_SCOPE[c] || c)}</td>`).join('') + '</tr>').join('');
  document.getElementById('count').textContent = `${out.length} / ${rows.length}`;
}

Promise.all(FILES.map(f => fetch(f).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.text(); }).then(t => parse(f, t))))
  .then(all => { rows = all.flat(); buildLegend(); buildFilters(); render(); })
  .catch(e => { document.body.insertAdjacentHTML('beforeend', `<p>Failed to load: ${e.message}. Serve over HTTP, file:// blocks fetch.</p>`); });
</script>
</body>
</html>
